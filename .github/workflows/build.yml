name: Build docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build

  content-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require and mask salt
        env:
          CONTENT_CHECK_EXTRA_TERMS: ${{ secrets.CONTENT_CHECK_EXTRA_TERMS }}
        run: |
          if [ -z "${CONTENT_CHECK_EXTRA_TERMS}" ]; then
            echo "::error::CONTENT_CHECK_EXTRA_TERMS secret is required and must be non-empty"
            exit 1
          fi
          salt_line="$(printf '%s\n' "${CONTENT_CHECK_EXTRA_TERMS}" | head -n 1 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          case "${salt_line}" in
            salt:*)
              salt_hex="${salt_line#salt:}"
              if [ -z "${salt_hex}" ]; then
                echo "::error::CONTENT_CHECK_EXTRA_TERMS salt is empty"
                exit 1
              fi
              echo "::add-mask::${salt_hex}"
              echo "::add-mask::${salt_line}"
              ;;
            *)
              echo "::error::CONTENT_CHECK_EXTRA_TERMS first line must be salt:<hex>"
              exit 1
              ;;
          esac
      - name: Run content check
        env:
          CONTENT_CHECK_EXTRA_TERMS: ${{ secrets.CONTENT_CHECK_EXTRA_TERMS }}
        run: |
          node scripts/content-check.mjs
          node scripts/content-check.mjs --self-test
